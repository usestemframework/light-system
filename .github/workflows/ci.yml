name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Vendor dependencies
        run: ./tools/vendor_thirdparty.sh
      - name: Check schema version pin
        run: ./tools/check_schema_version.sh
      - name: Install build dependencies
        run: brew install glfw shaderc vulkan-headers vulkan-loader pkg-config
      - name: Configure
        run: cmake -S prototype -B prototype/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build prototype/build -j
      - name: Builder unit tests (packing invariants)
        run: ./prototype/build/meridian_builder_tests
      - name: Builder smoke (committed scenes)
        run: |
          ./prototype/build/meridian_builder --manifest tools/sample_asset_manifest.txt
          ./prototype/build/meridian_builder --manifest benchmarks/scenes/benchmark_terrace_manifest.txt
          ./prototype/build/meridian_builder --manifest benchmarks/scenes/benchmark_gltf_block_manifest.txt
          ./prototype/build/meridian_builder --manifest benchmarks/scenes/benchmark_uv_seam_gltf_manifest.txt
      - name: Tool smoke (dump, trace, replay)
        run: |
          ./prototype/build/meridian_dump --input build/benchmark_terrace_grid.vgeo
          ./prototype/build/meridian_trace --manifest benchmarks/scenes/benchmark_terrace_manifest.txt --error-threshold 0.03
          ./prototype/build/meridian_replay --manifest benchmarks/scenes/benchmark_terrace_manifest.txt --script benchmarks/replays/terrace_streaming_replay.txt
          ./prototype/build/meridian_replay --manifest benchmarks/scenes/benchmark_uv_seam_gltf_manifest.txt --script benchmarks/replays/uv_seam_gltf_replay.txt

  ontos-view-linux:
    runs-on: ubuntu-latest
    name: ontos_view linux build (ALSA realtime audio)
    steps:
      - uses: actions/checkout@v4
      - name: Vendor dependencies
        run: ./tools/vendor_thirdparty.sh
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libvulkan-dev libglfw3-dev libshaderc-dev libasound2-dev
      - name: Configure (clang suite; the .mm targets need an ObjC++ compiler on linux)
        run: >-
          cmake -S prototype -B prototype/build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_OBJCXX_COMPILER=clang++
      - name: Build viewer (compile + link-checks the ALSA backend)
        run: cmake --build prototype/build --target ontos_view -j

  ontos-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    name: ontos stream dump (third spec implementation)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: usestemframework/simval
          path: simval
      - name: Build + verify committed ontos corpora bit-for-bit
        run: |
          set -e
          clang++ -std=c++17 -O2 -ffp-contract=off -Wall -Wextra -o /tmp/ontos_stream_dump tools/ontos/ontos_stream_dump.cpp
          /tmp/ontos_stream_dump simval/examples/ontos/r_pentomino/ontos.stream 42
          /tmp/ontos_stream_dump simval/examples/ontos_gravity/window/ontos.stream 42
          /tmp/ontos_stream_dump simval/examples/ontos_gravity/collapse/ontos.stream 11
          /tmp/ontos_stream_dump simval/examples/ontos_gravity/multipole/ontos.stream 17
          /tmp/ontos_stream_dump simval/examples/ontos_gravity/radial/ontos.stream 17
          /tmp/ontos_stream_dump simval/examples/ontos_gravity/shells/ontos.stream 17
          /tmp/ontos_stream_dump simval/examples/ontos_gravity/coarse_collapse/ontos.stream 23
          /tmp/ontos_stream_dump simval/examples/ontos_contact/contact/ontos.stream 11 --wav /tmp/cpp.wav
          cmp /tmp/cpp.wav simval/examples/ontos_contact/contact/ontos.wav
          /tmp/ontos_stream_dump simval/examples/ontos_contact/contact_collapse/ontos.stream 11 --wav /tmp/cpp2.wav
          cmp /tmp/cpp2.wav simval/examples/ontos_contact/contact_collapse/ontos.wav
          /tmp/ontos_stream_dump simval/examples/ontos_contact/walls/ontos.stream 22 --wav /tmp/cpp3.wav
          cmp /tmp/cpp3.wav simval/examples/ontos_contact/walls/ontos.wav
          /tmp/ontos_stream_dump simval/examples/ontos_contact/restitution/ontos.stream 11 --wav /tmp/cpp4.wav
          cmp /tmp/cpp4.wav simval/examples/ontos_contact/restitution/ontos.wav
          /tmp/ontos_stream_dump simval/examples/ontos_contact/wallshot/ontos.stream 3 --test-ic wallshot --wav /tmp/cpp5.wav
          cmp /tmp/cpp5.wav simval/examples/ontos_contact/wallshot/ontos.wav
          /tmp/ontos_stream_dump simval/examples/ontos_contact/coarsehit/ontos.stream 11 --test-ic coarsehit --wav /tmp/cpp6.wav
          cmp /tmp/cpp6.wav simval/examples/ontos_contact/coarsehit/ontos.wav
          echo "ontos_stream_dump + section-22 audio bit-identical on ${{ matrix.os }}"
